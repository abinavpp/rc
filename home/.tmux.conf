set -g default-command "${SHELL}"
set -g default-terminal "tmux-256color"

set-option -g history-limit 32768

set -g status-right-length 150
set -g status-interval 1
set-option -g status-style bg=default,fg=default
set -g status-right '#[fg=colour213]#(git -C "#{pane_current_path}" \
  symbolic-ref --short -q HEAD || git -C "#{pane_current_path}" \
  rev-parse --short HEAD)#[default] #{pane_current_path}'
set -g status-left "#[fg=colour214,bold]#{session_name}:#[default] "
set -g set-titles on
set -g set-titles-string 'tmux-#{session_name}'

set -g base-index 1
setw -g pane-base-index 1
setw -g window-status-current-format '#I#F '
set-window-option -g window-status-current-style bg=default,fg=green
setw -g window-status-format '#I#F '

set -g escape-time 0
set-option -g prefix C-a

bind-key -n Bspace send-keys C-h
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded"
set -s copy-command "xsel --clipboard --input"
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel

bind-key s command-prompt -p "send pane to:"  "join-pane -v -t '%%'"
bind-key c new-window -c ~
bind-key q kill-pane
bind-key Q kill-server
unbind-key d
unbind-key D

bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

source-file -q ~/.post-tmux.conf
